name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org com.hocine --project-name hocine_tv .
      - run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Hocine Tv"|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: HocineTv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
